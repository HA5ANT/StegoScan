[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stegoscan"
version = "3.0.0"
description = "Steganography triage for CTF, pentest and forensic workflows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["steganography", "forensics", "ctf", "dfir", "triage", "security"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# Intentionally empty, and it must stay that way: the tool has to run in
# air-gapped labs and on locked-down workstations with nothing but a Python
# interpreter. See docs/specs/2026-09-21-stegoscan-v3-design.md, principle 1.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
stegoscan = "stegoscan.cli:main"

[tool.setuptools.packages.find]
include = ["stegoscan*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
