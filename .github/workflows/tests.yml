name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package claims >=3.9; the matrix is what proves it.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # pytest is the only dependency, and it is dev-only.
      - run: python -m pip install --upgrade pip pytest

      - name: Run test suite
        run: python -m pytest

      - name: Smoke test the install-free invocation
        run: |
          python -m stegoscan --version
          python stegoscan --version

      - name: Sample carrier still yields its known verdict
        run: |
          set +e
          python stegoscan meme.jpg --no-artifacts --print none
          code=$?
          set -e
          # meme.jpg carries an appended RAR archive: CONFIRMED (exit 30).
          # A change here means either a detection regression or a new finding.
          test "$code" -eq 30

  constraints:
    name: zero runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tool has to run from a bare clone in air-gapped labs, so an added
      # runtime dependency is a design regression, not a convenience.
      - name: Assert pyproject declares no runtime dependencies
        run: |
          python - <<'PY'
          import sys, tomllib
          with open("pyproject.toml", "rb") as handle:
              declared = tomllib.load(handle)["project"]["dependencies"]
          if declared:
              sys.exit("runtime dependencies added: {}".format(declared))
          print("ok: no runtime dependencies")
          PY

      - name: Assert the package imports with no third-party packages installed
        run: python -c "import stegoscan, stegoscan.cli, stegoscan.bulk; print('ok:', stegoscan.__version__)"
